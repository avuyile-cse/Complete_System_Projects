<!DOCTYPE html>

<html lang="en">
	<head>
		<title>Login-Access Guard</title>
		<style>
			body{
				background-color:cornsilk;
				margin: 0;
				padding: 100px;
				display: flex;
				justify-content: center;
				align-items: center;
				height: auto;
				
				}
				
			.grid-container{
				display: grid;
				grid-template-columns: repeat(2,1fr);
				gap:50px;
				width: 800px;
				}
				
			.grid-item{
				background-color: skyblue;
				border-radius:10px;
				padding: 100px ;
				font-weight: bold;
				font-size: 1.8rem;
				text-align: center;
				cursor: pointer;
				}
				
			footer{
				text-align:center;
				text-weight:bold;
				}
				
		</style>
	</head>
	
	<body>
	
		<div class = "grid-container">
				<div class = "grid-item">View/edit data </div>
				<div class = "grid-item">Registration</div>
				<div class = "grid-item">Logs</div>
				<div class = "grid-item">Monitoring</div>			
		</div>
	
		
		<footer>
				<a href = "index.html">Home</a>
		</footer>
	
	</body>
	
</html>
