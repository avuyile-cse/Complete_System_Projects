<!DOCTYPE html>

<html lang="en">
	<head>
		<title>Login-Access Guard</title>
		<style>
			body{
				background-color: cornsilk;
				<background: linear-gradient(-300deg,cornsilk,#2f5f1a);>
				margin: 0 auto;
				padding: 50px;
				display: flex;
				flex-direction: column;
				justify-content: center;
				align-items: center;
				height: auto;
				}
				
			.grid-container{
				display: grid;
				grid-template-columns: repeat(2,1fr);
				gap:30px;
				width: 700px;
				}
			.grid-item{
				background-color: skyblue;
				width: 140px;
				height: 30px;
				border-radius:10px;
				border:2px solid transparent;
				border-color:white;
				
				display: flex;
				justify-content: center;
				align-items: center;
				
				text-align: center;
				padding: 100px ;
				font-weight: bold;
				font-size: 1.8rem;
				cursor: pointer;
				transition: all 0.3s ease;
				}
			.grid-item:hover{
				transform: translateY(-10px) scale(1.03);
				background-color: cadetblue;
				box-shadow: 0 10px 15px rgba(0,0,0,0.3);
				color:white;
				}
			.grid-item:active{
				transform: scale(0.96);
				}
				
			.main-container{
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 25px;
				}
					
			.image{
				border: 3px solid black;
				border-radius: 5px;
				display:block;
				margin: 0 auto;
				height: 100px;
				width: 200px;
				border-radius:12px;
				transition: transform 0.3s ease, box-shadow 0.3s ease;
				}
			.image:hover{
				transform: scale(1.02);
				box-shadow: 0 10px 20px rgba(0,0,0,0.2);
				cursor:pointer;
				border-color: coral;
				box-shadow: 0 0 10px rgba(0,0,0,5);
				}
			.card-icon{
				width: 70px;
				height: 70px;
				object-fit: contain;
				transition: transform 0.3s ease;
				}
			.grid-item:hover .card-icon{
				transform: scale(1.15) rotate(-4deg);
				}
				
			footer{
		
				}
				
		</style>
	</head>
	
	<body>
		<div class="main-container">
		
			<a href ="index.html">
				<img class ="image" src ="../static/logo.png">
			</a>
			
			<div class = "grid-container">
				<div class = "grid-item">
					<img src="../static/edit.png" class="card-icon" alt="Database icon">
					<span>View/Edit Data</span>
				</div>
				<div class = "grid-item">
					<img src="../static/Registration.png" class = "card-icon" alt="Registration icon">
					<span>Registration</span>
				</div>
				<div class = "grid-item">
					<img src="../static/Logs.png" class = "card-icon" alt="Logs icon">
					<span>Logs</span>
				</div>
					
				<div class = "grid-item">
					<img src="../static/Monitoring.png" class="card-icon" alt="Monitoring icon">
					<span>Monitoring</span>
				</div>			
			</div>
			
		</div>
	
		
		<footer>
				<!--
					<a href = "index.html">Home</a>
				-->
		</footer>
	
	</body>
	
</html>
